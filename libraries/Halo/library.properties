name=Halo
version=1.0.0
author=PopaSpinka
maintainer=PopaSpinka
sentence=A watch UI library written from scratch for the Waveshare ESP32-S3-Touch-AMOLED-1.75C: own display and touch drivers, damage-only frames at 60 fps.
paragraph=No LVGL, Arduino_GFX or sensor libraries. CO5300 display driver (QSPI, interrupt-driven DMA, TE sync), CST9217 touch driver, a two-core frame engine that draws and sends only changed bands, shapes, text and icons in its own formats (tools/halo_assets.py), springs, Wear OS-style lists and screen transitions.
category=Display
